plugins {
    id 'java'
}

repositories {
    mavenCentral()
    maven { url = 'https://repo.runelite.net' }
}

def runeLiteVersion = project.findProperty('runeliteVersion') ?: 'latest.release'

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:4.11.0'
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
}

group = 'com.farmingdiscordstatus'
version = '0.3.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(11) }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.fork = true
}

// Offline maintenance tool only: these classes are never packaged in the plugin.
// Generate reviewed data from a pinned RuneLite release; runtime code reads the
// resulting resource through public configuration APIs.
sourceSets {
    catalogGenerator { java.srcDir 'tools/catalog/src' }
}
dependencies {
    catalogGeneratorImplementation "net.runelite:client:${runeLiteVersion}"
}
tasks.register('generatePatchCatalog', JavaExec) {
    classpath = sourceSets.catalogGenerator.runtimeClasspath
    mainClass = 'com.farmingdiscordstatus.tools.ExportPatchCatalog'
    args file('src/main/resources/com/farmingdiscordstatus/patch-catalog.json').absolutePath, runeLiteVersion
    doFirst {
        if (runeLiteVersion == 'latest.release') throw new GradleException('Pin -PruneliteVersion before generating the catalog')
    }
}
